name: Build RustDesk iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại bản dựng'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.4"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  build-ios:
    name: Build iOS IPA (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install nasm yasm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-ios-cache

      - name: Generate Flutter-Rust Bridge
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Build Rust core library (liblibrustdesk.a)
        run: |
          rustup target add aarch64-apple-ios
          cargo build --features flutter,hwcodec --${{ inputs.build_type }} --target aarch64-apple-ios --lib

      - name: Build Flutter iOS App & Package IPA
        shell: bash
        run: |
          pushd flutter
          flutter pub get
          flutter build ipa --${{ inputs.build_type }} --no-codesign
          mkdir -p build/ios/ipa/Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          fi
          if [ -d "build/ios/ipa/Payload/Runner.app" ]; then
            cd build/ios/ipa
            zip -r -q "rustdesk-ios-arm64-${{ inputs.build_type }}.ipa" Payload
            cd ../../..
          fi
          popd

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-iOS-arm64-${{ inputs.build_type }}
          path: flutter/build/ios/ipa/*.ipa
